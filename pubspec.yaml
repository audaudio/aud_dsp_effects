name: aud_dsp_effects
description: "Effects of the Audanika Audio Engine: reverbs, delays, oscillators, filters, dynamics, modulation, distortion"
version: 0.2.0
publish_to: none
homepage: https://github.com/audaudio/aud_dsp_effects
repository: https://github.com/audaudio/aud_dsp_effects

environment:
  sdk: ^3.12.2

dependencies:
  ffi: ^2.2.0
  aud_audio_core:
    git:
      url: git@github.com:audaudio/aud_audio_core.git
      tag_pattern: "{{version}}"
    version: ^0.5.2
  code_assets: ^2.1.0
  hooks: ^2.2.0
  logging: ^1.3.0
  meta: ^1.19.0
  native_toolchain_c: ^0.19.5
  record_use: ^1.1.1

dev_dependencies:
  aud_audio_graph:
    git:
      url: git@github.com:audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: ^0.5.2
  dna_audanika: ^0.0.2
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  helix: ^1.12.0
  test: ^1.33.0