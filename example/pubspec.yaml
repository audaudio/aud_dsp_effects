name: aud_dsp_effects_example
description: "Example of aud_dsp_effects: a chord through delay, reverb and limiter on the engine of aud_audio, on iOS and Android, with the numbers of the chain and the render time of every node."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The example plays the package of this checkout.
  aud_dsp_effects:
    path: ../
  # The engine that plays the nodes, resolved from its git tags like an app
  # resolves it.
  aud_audio:
    git:
      url: git@github.com:audaudio/aud_audio.git
      tag_pattern: "{{version}}"
    version: ^0.5.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
